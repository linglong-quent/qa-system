# ═══════════════════════════════════════════════════════════════════
# 命名冲突检测 (STYLE-03b) — 跨域命名空间隔离 & 单一数据源
# 规则: NAMING_REGISTRY.md, quant-coding-standards.md §STYLE-03b
# ═══════════════════════════════════════════════════════════════════
naming_conflict_check:
  enabled: true
  severity: BLOCKER
  max_issues: 100
  skip_dirs:
  - __pycache__
  - .git
  - .ai
  - venv
  - .venv
  - node_modules
  - dist
  - build
  - backup
  - .mypy_cache
  - .pytest_cache
  exempt_file_patterns:
  - test_
  - conftest
  - setup.py
  - conf.py
  ssot_exemptions:
  # shared 层异常类 — 标准命名，无需域前缀
  - "shared/exceptions.py:LingLongError"
  - "shared/exceptions.py:DataError"
  - "shared/exceptions.py:ConfigError"
  - "shared/exceptions.py:NetworkError"
  - "shared/exceptions.py:CalculationError"
  - "shared/exceptions.py:ValidationError"
  - "shared/exceptions.py:BusinessError"
  - "shared/exceptions.py:ResourceError"
  - "shared/exceptions.py:DataNotFoundError"
  - "shared/exceptions.py:DataQualityError"
  - "shared/exceptions.py:DatabaseError"
  - "shared/exceptions.py:ConnectionTimeoutError"
  - "shared/exceptions.py:SequenceError"
  # shared 层已知 SSOT
  - "shared/resilience.py:CircuitBreaker"
  - "shared/risk_types.py:GateResult"
  - "shared/market_regime.py:MarketRegime"
  - "shared/market_regime.py:MarketRegimeResult"
  # domain 层 SSOT（历史冲突已修复）
  - "domain/decision/engines/rotation_engine.py:RotationSignal"
  - "domain/cognition/portrait/position_risk.py:PositionRiskState"
  - "domain/cognition/portrait/capital_flow.py:PortraitCapitalFlowResult"
  - "backtest/engines/factor_ic_analysis.py:FactorICResult"
