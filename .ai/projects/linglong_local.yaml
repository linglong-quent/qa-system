codestyle_check:
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  - ops/
  - scripts/
  nfr_baseline:
    max_function_length_lines: 60
    max_class_length_lines: 500
largefiles_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  - ops/
  - scripts/
  exclude_subdirs:
  - __pycache__
  - _deprecated
  - archive
  - node_modules
  - .git
  - .pytest_cache
  nfr_baseline:
    max_class_length_lines: 500
  baseline_file: e:\WB\QA-System\.ai\projects\largefiles_baseline.yaml
lookahead_check:
  enabled: true
  scan_dirs:
  - domain/
  - backtest/
  - p0/
  backtest_keywords:
  - backtest
  - strategy
  - signal
  - factor
  - engine
inplace_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - p0/
  - backtest/
fusedetect_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - linglong/
  - scripts/
  triggers: []
secret_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - config/
securityplus_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
import_boundary_check:
  enabled: true
  severity: BLOCKER
  # 核心生产代码目录（禁止导入 dev-only 模块）
  restricted_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  forbidden_prefixes:
  - tools
  - scripts
  - tests
  - _probe_archive
  - _deprecated
  - archive
  - linglong
  # Python stdlib 自动包含；这里仅配置第三方白名单 + QA 桥接模块
  allowed_modules:
  - numpy
  - pandas
  - requests
  - akshare
  - baostock
  - pytdx
  - tushare
  - sqlalchemy
  - pymysql
  - redis
  - yaml
  - psutil
  - tqdm
  - sklearn
  - scipy
  - statsmodels
  - torch
  - ta
  - talib
  - backtrader
  - vectorbt
  - qbstyles
  - matplotlib
  - seaborn
  max_depth: 5
  # 跨域 import 豁免（架构统一后无需豁免，保留空列表以维持 YAML 锚点）
  import_exempt: &id001 []
metrics:
  enabled: true
  tracked_issues:
  - metric: inplace_count
    source: inplace_check
  - metric: lookahead_count
    source: lookahead_check
  - metric: secret_count
    source: secret_check
  - metric: deadcode_count
    source: deadcode_check
  - metric: cyclic_count
    source: cyclic_check
meta_quality:
  enabled: true
  tool_version_pinning:
    enabled: true
    config_files:
    - .pre-commit-config.yaml
    pinned_versions:
      black: 24.4.2
      isort: 5.13.2
      flake8: 7.1.0
      mypy: 1.10.0
  exclude_consistency:
    enabled: true
    config_files:
    - .pre-commit-config.yaml
    required_excludes:
    - _deprecated
    - archive
  workflow_quality:
    enabled: true
    scan_dir: .github/workflows/
    checks:
      yaml_syntax: true
      encoding_utf8: true
      no_mojibake: true
  encoding_check:
    enabled: true
