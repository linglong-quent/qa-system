version: '4.0'
last_updated: '2026-07-25'
bootstrap_mode: false
default_profile: full
iso_25010_scoring:
  enabled: true
  total_max: 80
  red_line_total: 40
  dimensions:
  - id: ISO-FUNC
    name: 功能合适性
    weight: 1.0
    checkers:
    - lookahead_check
    - deadcode_check
  - id: ISO-PERF
    name: 性能效率
    weight: 1.0
    checkers:
    - code_ban
  - id: ISO-COMPAT
    name: 兼容性
    weight: 1.0
    checkers:
    - code_ban
  - id: ISO-USABILITY
    name: 易用性
    weight: 1.0
    checkers:
    - inplace_check
  - id: ISO-RELIABILITY
    name: 可靠性
    weight: 1.5
    checkers:
    - lookahead_check
    - code_ban
  - id: ISO-SECURITY
    name: 安全性
    weight: 1.5
    checkers:
    - secret_check
    - code_ban
  - id: ISO-MAINTAIN
    name: 可维护性
    weight: 1.0
    checkers:
    - deadcode_check
    - cyclic_check
  - id: ISO-PORTABLE
    name: 可移植性
    weight: 0.5
    checkers:
    - meta_quality
nasa_power_of_10_scoring:
  enabled: true
  total_max: 100
  red_line_total: 60
  rules:
  - id: NASA-1
    enabled: true
    weight: 0.1
  - id: NASA-2
    enabled: true
    weight: 0.1
  - id: NASA-3
    enabled: true
    weight: 0.1
  - id: NASA-4
    enabled: true
    weight: 0.1
  - id: NASA-5
    enabled: true
    weight: 0.1
  - id: NASA-6
    enabled: true
    weight: 0.1
  - id: NASA-7
    enabled: true
    weight: 0.1
  - id: NASA-8
    enabled: true
    weight: 0.1
  - id: NASA-9
    enabled: true
    weight: 0.1
  - id: NASA-10
    enabled: true
    weight: 0.1
iso_checker_weights:
  code_ban_check: 0.2
  secret_check: 0.25
  deadcode_check: 0.15
  cyclic_check: 0.15
  inplace_check: 0.1
  lookahead_check: 0.15
plugins:
  enabled: true
  default_plugin_enabled: true
  enabled_plugins:
    plugin_quantspec_iterrows_checker: true
    plugin_quantspec_magic_number_checker: true
  plugin_configs:
    plugin_quantspec_iterrows_checker:
      scan_dirs:
      - src/
      - strategies/
      - backtest/
    plugin_quantspec_magic_number_checker:
      scan_dirs:
      - src/
      - strategies/
profiles:
  full:
    description: 全量检查（生产标准）
    checkers_on:
    - inplace_check
    - lookahead_check
    - secret_check
    - cyclic_check
    - code_ban
    - import_boundary
    - quality_gates
    - claude_validation
    - codestyle
    - governance
    - securityplus
    - documentation
    - zeroprint
    - customrules
    - fusedetect
    - docconsistency
    - naming_conflict
    - production
    - deadcode_check
    - config_audit
    - largefiles
  dev:
    description: 开发模式
    checkers_on:
    - inplace_check
    - lookahead_check
    - secret_check
  quick:
    description: 快速检查
    checkers_on:
    - secret_check
    - lookahead_check
  ci:
    description: CI 快速检查（含大文件强制阻断）
    checkers_on:
    - inplace_check
    - lookahead_check
    - secret_check
    - cyclic_check
    - code_ban
    - import_boundary
    - quality_gates
    - naming_conflict
    - zeroprint
    - codestyle
    - largefiles
  deadcode:
    description: 仅运行孤儿代码检查（单独运行，不阻断）
    checkers_on:
    - deadcode_check
scoring:
  total_max: 100
  red_lines:
  - id: RL-ERRORS
    field: errors
    operator: '>'
    value: 0
    message: 存在阻断级错误
    severity: BLOCKER
quality_gates:
  enabled: true
  severity: WARN
  fail_condition:
    errors: 0
    score: 60
    cooldown: 300
claude_validation:
  enabled: true
  severity: WARN
config_audit_check:
  enabled: true
  severity: INFO
inplace_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  - config/
  - ops/
  severity: WARN
  exempt_dirs:
  - tools/_deprecated/
  - _deprecated/
lookahead_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  - config/
  - ops/
  severity: BLOCKER
secret_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  - config/
  - ops/
  severity: BLOCKER
  whitelist:
  - MISSING_API_KEY
  - INVALID_API_KEY
  - INSUFFICIENT_ROLE
deadcode_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  - config/
  severity: INFO
  exempt_names:
  - main
  - __init__
  - __main__
  - __version__
  - __all__
  - app
  - logger
  - setup
  - config
  - settings
  - get_
  - set_
  - is_
  - has_
  - can_
  - should_
  entry_points:
  - main.py
  - run_pipeline.py
  - start_all_monitors.py
  - scripts/run_daily.py
  - scripts/report_daily.py
  scan_public_only: true
solid_check:
  enabled: true
  scan_dirs:
  - domain/
  - scripts/
  - shared/
  - backtest/
  severity: WARN
  func_max_lines: 120
  func_max_args: 7
  class_max_methods: 16
  method_max_args: 8
  override_arg_tolerance: 3
  dup_body_min_lines: 12
  high_level_dirs:
  - scripts
  allowed_concrete: []
cyclic_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  - config/
  - ops/
  severity: BLOCKER
code_ban_check:
  enabled: true
  scan_dirs:
  - domain/
  - shared/
  - access/
  - p0/
  - backtest/
  - config/
  - ops/
  severity: WARN
  ip_whitelist:
  - 119.147.212.81
  - 192.168.1.4
  config_file_patterns:
  - _config.py
  - config_
  - settings.py
  - data_config.py
  - data_paths
  - config
  - settings
  - constants
  large_class_threshold: 500
  path_prefixes:
  - 'D:\'
  - 'E:\'
  - 'C:\Users'
  - '/Users/'
  - '/home/'
  - '/tmp/'
  stub_keywords:
  - stub
  - TODO
  - 占位
  - 待实现
  - not implemented
  - pass  # 仅检测空函数体的 pass
  ban_rules:
    bare_print: true
    sql_injection: true
    except_pass: true
    hardcoded_path: WARN
    magic_number: WARN
    stub_code: WARN
    broad_exception: WARN
