version: '3.0'
last_updated: '2026-07-17'
bootstrap_mode: false
default_profile: full
iso_25010_scoring:
  enabled: true
  total_max: 80
  red_line_total: 40
  dimensions:
  - id: ISO-FUNC
    name: 功能合适性
    weight: 1.0
    checkers:
    - lookahead_check
    - deadcode_check
  - id: ISO-PERF
    name: 性能效率
    weight: 1.0
    checkers:
    - code_ban
  - id: ISO-COMPAT
    name: 兼容性
    weight: 1.0
    checkers:
    - code_ban
  - id: ISO-USABILITY
    name: 易用性
    weight: 1.0
    checkers:
    - inplace_check
  - id: ISO-RELIABILITY
    name: 可靠性
    weight: 1.5
    checkers:
    - lookahead_check
    - code_ban
  - id: ISO-SECURITY
    name: 安全性
    weight: 1.5
    checkers:
    - secret_check
    - code_ban
  - id: ISO-MAINTAIN
    name: 可维护性
    weight: 1.0
    checkers:
    - deadcode_check
    - cyclic_check
  - id: ISO-PORTABLE
    name: 可移植性
    weight: 0.5
    checkers:
    - meta_quality
nasa_power_of_10_scoring:
  enabled: true
  total_max: 100
  red_line_total: 60
  rules:
  - id: NASA-1
    enabled: true
    weight: 0.1
  - id: NASA-2
    enabled: true
    weight: 0.1
  - id: NASA-3
    enabled: true
    weight: 0.1
  - id: NASA-4
    enabled: true
    weight: 0.1
  - id: NASA-5
    enabled: true
    weight: 0.1
  - id: NASA-6
    enabled: true
    weight: 0.1
  - id: NASA-7
    enabled: true
    weight: 0.1
  - id: NASA-8
    enabled: true
    weight: 0.1
  - id: NASA-9
    enabled: true
    weight: 0.1
  - id: NASA-10
    enabled: true
    weight: 0.1
iso_checker_weights:
  code_ban_check: 0.2
  secret_check: 0.25
  deadcode_check: 0.15
  cyclic_check: 0.15
  inplace_check: 0.1
  lookahead_check: 0.15
plugins:
  enabled: true
  default_plugin_enabled: true
  enabled_plugins:
    plugin_quantspec_iterrows_checker: true
    plugin_quantspec_magic_number_checker: true
  plugin_configs:
    plugin_quantspec_iterrows_checker:
      scan_dirs:
      - src/
      - strategies/
      - backtest/
    plugin_quantspec_magic_number_checker:
      scan_dirs:
      - src/
      - strategies/
profiles:
  full:
    description: 全量检查（生产标准）
    checkers_on:
    - inplace_check
    - lookahead_check
    - secret_check
    - cyclic_check
    - import_boundary
    - config_audit
    - quality_gates
    - claude_validation
    - production
    - codestyle
    - governance
    - securityplus
    - documentation
    - zeroprint
    - customrules
    - fusedetect
    - docconsistency
    - semantic_truth
    - docstring_code
    - runtime_drift
    - vcs_governance
    - blindspot
    - container_plane
    - largefiles
    - naming_conflict
    - deadcode_check
    - code_ban
    - solid
  dev:
    description: 开发模式
    checkers_on:
    - inplace_check
    - lookahead_check
    - secret_check
  quick:
    description: 快速检查
    checkers_on:
    - secret_check
    - lookahead_check
scoring:
  total_max: 100
  red_lines:
  - id: RL-ERRORS
    field: errors
    operator: '>'
    value: 0
    message: 存在阻断级错误
    severity: BLOCKER
quality_gates:
  enabled: true
  severity: WARN
claude_validation:
  enabled: true
  severity: WARN
config_audit_check:
  enabled: true
  severity: WARN
inplace_check:
  enabled: true
  scan_dirs:
  - src/
  severity: WARN
lookahead_check:
  enabled: true
  scan_dirs:
  - scripts/
  - src/
  severity: BLOCKER
secret_check:
  enabled: true
  scan_dirs:
  - src/
  severity: BLOCKER
deadcode_check:
  enabled: true
  scan_dirs:
  - scripts/
  - src/
  - domain/
  - shared/
  - pipeline/
  - D:/WB/linglong
  - D:/WB/TDX
  - D:/WB/NEWSFORGE
  - D:/WB/factor_forge
  ref_dirs:
  - scripts/
  - src/
  - tests/
  - D:/WB/linglong
  - D:/WB/TDX
  - D:/WB/NEWSFORGE
  - D:/WB/factor_forge
  exclude_patterns:
  - "**/open_source_systems/**"
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/.deps/**"
  - "**/vendor/**"
  - "**/__pycache__/**"
  - "**/archive/**"
  - "**/_recovery_backup/**"
  - "**/.t18_*"
  # DEADCODE-003 只对库目录生效：scripts/ 下是 CLI/调度器直接执行的脚本，
  # 本就不该被 import，对其报"孤岛模块"是噪声
  library_dirs:
  - src/
  - domain/
  - shared/
  - core/
  - app/
  - lib/
  severity: BLOCKER
cyclic_check:
  enabled: true
  scan_dirs:
  - src/
  severity: BLOCKER
code_ban_check:
  enabled: true  # A++ 标准
  scan_dirs:
  - scripts/
  severity: WARN
  ban_rules:
    bare_print: true
    sql_injection: true
    except_pass: true
    hardcoded_path: WARN
    magic_number: WARN
  dynamic_exec_exempt_substrings:
  - chk_codeban_a.py
  - qa_check.py
  large_class_exempt_names:
  - HealthScorer
  - GateKeeper
  orphan_exempt_prefixes:
  - scripts.qa
  - scripts.chk_image_provenance
  - scripts
  magic_whitelist:
    # 基本数
    - 0
    - 1
    - 2
    - 3
    - -1
    - 1.0
    - 0.0
    - 0.5
    # 时间单位
    - 60
    - 3600
    - 86400
    - 24
    - 7
    - 12
    # 百分比/单位
    - 100
    - 1000
    - 10000
    # HTTP 状态码
    - 200
    - 404
    - 500
    - 5
    - 20
    - 40
    - 16
    - 15
    - 127
    - 160
    - 600
    - 110
    - 103
    - 3000
    - 2000
    - 65535
    - 100000
    - 9989
    # 金融/量化
    - 252
    - 365
    - 0.9
    - 0.95
    - 0.99
    - 0.01
    - 0.001
    # 缓冲区/阈值
    - 65536
    - 4096
    - 128
    - 256
    - 512
    # 高频阈值/缓冲区
    - 78
    - 10
    - 4
    - 8
    - 6
    - 50
    - 25
    - 30
    - 150
    - 80
    - 19
    - 96
    - 74
    - 111
    - 1024
    - 2048
    - 4096
    # 行数阈值
    - 120
    - 300
    - 500
    - 5
    - 20
    - 40
    - 16
    - 15
    - 127
    - 160
    - 600
    - 110
    - 103
    - 3000
    - 2000
    - 65535
    - 100000
    - 9989
import_boundary_check:
  enabled: true
  severity: BLOCKER
  restricted_dirs:
  - src/_core/
  forbidden_prefixes:
  - tests
  - scripts
  - tools
  - archive
  allowed_modules:
  - numpy
  - pandas
  - requests
  max_depth: 3
metrics:
  enabled: true
  tracked_issues:
  - metric: inplace_count
    source: inplace_check
  - metric: lookahead_count
    source: lookahead_check
  - metric: secret_count
    source: secret_check
  - metric: deadcode_count
    source: deadcode_check
  - metric: cyclic_count
    source: cyclic_check
meta_quality:
  enabled: true
  tool_version_pinning:
    enabled: true
    config_files:
    - .pre-commit-config.yaml
    pinned_versions:
      black: 24.4.2
      isort: 5.13.2
      flake8: 7.1.0
      mypy: 1.10.0
  exclude_consistency:
    enabled: true
    config_files:
    - .pre-commit-config.yaml
    required_excludes:
    - _deprecated
    - archive
  workflow_quality:
    enabled: true
    scan_dir: .github/workflows/
    checks:
      yaml_syntax: true
      encoding_utf8: true
      no_mojibake: true
  encoding_check:
    enabled: true
    scan_dirs:
    - .ai/config/
    - .github/workflows/
    expected_encoding: utf-8
production_check:
  enabled: true
  severity: WARN
  scan_dirs:
  - scripts/
  - src/
  active_checks:
  - PROD-01
  - PROD-02
  - PROD-03
  - PROD-04
  - PROD-07
  - PROD-08
  - PROD-09
  - PROD-10
codestyle_check:
  enabled: true
  severity: WARN
  scan_dirs:
  - src/
governance_check:
  enabled: true
  severity: WARN
  strict_python_struct: false  # QA系统自身是工具仓库，不需要src/tests
  expected_dirs:
  - scripts/
  - docs/
  - .ai/config/
  - .github/workflows/
securityplus_check:
  enabled: true
  severity: WARN
  scan_dirs:
  - src/
documentation_check:
  enabled: true
  severity: WARN
  docs_dir: docs/
zeroprint_check:
  enabled: true
  severity: WARN
  scan_dirs:
  - src/
  banned_modules:
  - core
  - engine
  - api
customrules_check:
  enabled: true
  severity: WARN
  scan_dirs:
  - scripts/
  - src/
  rules:
  - name: 裸 except
    pattern: '^\s*except\s*:'
    severity: BLOCKER
naming_conflict_check:
  enabled: true
  severity: BLOCKER
  max_issues: 100
  skip_dirs:
  - __pycache__
  - .git
  - .ai
  - venv
  - .venv
  - node_modules
  - dist
  - build
  - backup
  - .mypy_cache
  - .pytest_cache
  exempt_file_patterns:
  - test_
  - conftest
  - setup.py
  - conf.py
  ssot_exemptions:
  - "shared/exceptions.py:LingLongError"
  - "shared/exceptions.py:DataError"
  - "shared/resilience.py:CircuitBreaker"
  - "domain/decision/engines/rotation_engine.py:RotationSignal"
  - "domain/cognition/portrait/position_risk.py:PositionRiskState"
solid_check:
  enabled: true
  scan_dirs:
  - scripts/
  severity: BLOCKER
  func_max_lines: 120
  func_max_args: 8
  class_max_methods: 25
  method_max_args: 8
  override_arg_tolerance: 3
  dup_body_min_lines: 12
  high_level_dirs:
  - scripts
  allowed_concrete: []
fusedetect_check:
  enabled: true
  severity: BLOCKER
  scan_dirs:
  - src/
  triggers:
  - requests
  - urllib
  - socket
docconsistency_check:
  enabled: true
  severity: BLOCKER
  code_dirs:
  - src/
  doc_dirs:
  - docs/
agent_boundary_exempt:
- scripts/qa_gate.py

# ── T29 盲区规则集（七类盲区 + docstring 追加类）──────────────
# 每条规则均附"能失败"的注入证明，见 scripts/qa_rule_proof.py
semantic_truth_check:
  enabled: true
  severity: BLOCKER
  scan_dirs:
  - src/
  - scripts/
  - domain/
  - D:/WB/TDX
  - D:/WB/NEWSFORGE
  - D:/WB/factor_forge
  - D:/WB/linglong
  exclude_patterns:
  - "**/open_source_systems/**"
  - "**/.t18_*"
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/.deps/**"
  - "**/vendor/**"
  - "**/__pycache__/**"
  - "**/archive/**"
  - "**/_recovery_backup/**"
  random_block_min_fields: 3
docstring_code_check:
  enabled: true
  severity: BLOCKER
  scan_dirs:
  - src/
  - scripts/
  - domain/
  report_marker_only: true
runtime_drift_check:
  enabled: true
  severity: BLOCKER          # CI runner 无宿主进程，探测失败即静默跳过
  scan_dirs:
  - scripts/
  - src/
  - domain/
  min_dependents: 3
  probe_endpoints: true
  endpoint_guardians: {}
vcs_governance_check:
  enabled: true
  severity: BLOCKER
  max_dirty_ratio: 0.5
  min_tracked: 50
  critical_min_files: 5
  critical_dirs: []
blindspot_check:
  enabled: true
  severity: BLOCKER
  scan_dirs:
  - src/
  - scripts/
  - domain/
  abs_path_min_hits: 3
  dockerfiles:
  - Dockerfile
  clone_pairs: []
  doc_claims: []
  declared_paths: []
  critical_paths: []

container_plane_check:
  enabled: true
  severity: BLOCKER
  max_restarts: 3
  drift_grace_seconds: 60
  watch_containers: {}
  required_services: []
